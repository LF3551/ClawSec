# Usage:  CLAWSEC_PASSWORD="$(openssl rand -base64 24)" docker compose up
# The password is passed through the environment, never on the command line.
services:
  clawsec-server:
    build: .
    container_name: clawsec-server
    ports:
      - "8888:8888"
    environment:
      CLAWSEC_PASSWORD: ${CLAWSEC_PASSWORD:?set CLAWSEC_PASSWORD}
    command: ["-l", "-p", "8888", "-K", "-v"]
    restart: unless-stopped
    networks:
      - clawsec-net

  clawsec-client:
    build: .
    container_name: clawsec-client
    depends_on:
      - clawsec-server
    environment:
      CLAWSEC_PASSWORD: ${CLAWSEC_PASSWORD:?set CLAWSEC_PASSWORD}
    command: ["clawsec-server", "8888"]
    stdin_open: true
    tty: true
    networks:
      - clawsec-net

networks:
  clawsec-net:
    driver: bridge
