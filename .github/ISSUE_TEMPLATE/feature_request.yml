name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How could ClawSec solve it? Note whether it would change the wire protocol.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
