name: Release

# Runs when a GitHub release is published (or manually for an existing tag):
#   1. builds and tests static Linux binaries (x86_64, arm64) and macOS
#      binaries (arm64, x86_64)
#   2. attaches clawsec-<version>-<os>-<arch>.tar.gz and SHA256SUMS to the release
#   3. records the source tarball checksum in PKGBUILD and updates the
#      Homebrew tap (LF3551/homebrew-clawsec)
# Docker images (docker-publish.yml) and the AUR package (aur-publish.yml) are
# published by their own workflows on the same event.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag, e.g. v3.0.0'
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  build:
    name: build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux: fully static (musl) binaries built in Alpine, so they run on
          # any distribution without OpenSSL/libargon2/zlib installed
          - name: linux-x86_64
            os: ubuntu-24.04
            kind: static
          - name: linux-arm64
            os: ubuntu-24.04-arm
            kind: static
          # macOS: links Homebrew's openssl@3 and argon2
          - name: macos-arm64
            os: macos-latest
            kind: macos
          - name: macos-x86_64
            os: macos-15-intel
            kind: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0

      # Build the tagged source, but run the release test harness from the
      # workflow's own commit, so a tooling fix can be re-run for an existing
      # tag without moving it (moving a tag changes the source tarball hash
      # already published to AUR).
      - name: Use test harness from the workflow commit
        run: git show "${GITHUB_SHA}:tests/e2e.sh" > "$RUNNER_TEMP/e2e.sh"

      - name: Check tag matches source version
        run: |
          src=$(sed -n 's/^#define CLAWSEC_VERSION "\(.*\)"/\1/p' src/version.h)
          test "v$src" = "$TAG" || { echo "tag $TAG != src/version.h $src"; exit 1; }

      - name: Build static binary and unit tests (Alpine container)
        if: matrix.kind == 'static'
        run: |
          alpine=$(sed -n 's/^ARG ALPINE=//p' Dockerfile)
          docker run --rm -v "$PWD:/w" -w /w/src "$alpine" sh -euc '
            apk add --no-cache build-base linux-headers openssl-dev openssl-libs-static \
              argon2-dev argon2-static zlib-dev zlib-static >/dev/null
            make clean
            make static
            make test'
          sudo chown -R "$(id -u):$(id -g)" src
          file src/clawsec | grep -q 'static' || { echo "not a static binary"; exit 1; }

      - name: End-to-end tests (static binary on the Ubuntu host)
        if: matrix.kind == 'static'
        run: bash "$RUNNER_TEMP/e2e.sh" src/clawsec

      - name: Package (static)
        if: matrix.kind == 'static'
        run: scripts/build-release.sh "$TAG" --binary src/clawsec

      - name: Install dependencies (macOS)
        if: matrix.kind == 'macos'
        run: brew install openssl@3 argon2

      - name: Unit tests (macOS)
        if: matrix.kind == 'macos'
        run: cd src && make macos && make test-macos

      - name: Package (macOS)
        if: matrix.kind == 'macos'
        run: scripts/build-release.sh "$TAG"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.name }}
          path: release-*/clawsec-*.tar.gz
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          merge-multiple: true
          path: dist

      - name: Checksums
        run: |
          cd dist
          find . -name '*.tar.gz' -exec mv {} . \;
          sha256sum clawsec-*.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - name: Attach to release
        run: |
          cd dist
          gh release upload "$TAG" clawsec-*.tar.gz SHA256SUMS --clobber --repo "$GITHUB_REPOSITORY"

  packaging-checksums:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Source tarball checksum
        id: src
        run: |
          url="https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${TAG}.tar.gz"
          sha=$(curl -fsSL "$url" | sha256sum | cut -d' ' -f1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "source tarball sha256: $sha"

      - name: Update PKGBUILD
        env:
          SHA: ${{ steps.src.outputs.sha }}
        run: |
          sed -i -E "s|^pkgver=.*|pkgver=${TAG#v}|; s|^sha256sums=.*|sha256sums=('$SHA')|" aur/PKGBUILD
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add aur/PKGBUILD
          if git diff --cached --quiet; then echo "Already up to date"; exit 0; fi
          git commit -m "chore(release): PKGBUILD checksum for ${TAG}"
          git push origin HEAD

      # Homebrew tap: LF3551/homebrew-clawsec (its own CI builds and tests the
      # formula on macOS arm64/x86_64 and Linux). Pushed with a deploy key
      # that can write to the tap repository only.
      - name: Update Homebrew tap
        env:
          URL: ${{ steps.src.outputs.url }}
          SHA: ${{ steps.src.outputs.sha }}
          TAP_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
        run: |
          if [ -z "$TAP_KEY" ]; then echo "HOMEBREW_TAP_DEPLOY_KEY not set, skipping"; exit 0; fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$TAP_KEY" > ~/.ssh/tap_key && chmod 600 ~/.ssh/tap_key
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/tap_key -o IdentitiesOnly=yes"
          git clone -q git@github.com:LF3551/homebrew-clawsec.git "$RUNNER_TEMP/tap"
          cd "$RUNNER_TEMP/tap"
          sed -i -E "s|^  url \".*\"|  url \"$URL\"|; s|^  sha256 \".*\"|  sha256 \"$SHA\"|" Formula/clawsec.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/clawsec.rb
          if git diff --cached --quiet; then echo "Tap already up to date"; exit 0; fi
          git commit -m "clawsec ${TAG#v}"
          git push -q origin HEAD
