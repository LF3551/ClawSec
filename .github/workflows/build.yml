name: Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]


permissions:
  contents: read

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libssl-dev libargon2-dev zlib1g-dev build-essential
    
    - name: Build and unit tests (warnings are errors)
      run: |
        cd src
        make werror
    
    - name: Test binary
      run: |
        cd src
        ./clawsec -h || true
        test -f clawsec

    - name: End-to-end tests
      run: bash tests/e2e.sh src/clawsec

    - name: VPN end-to-end tests (TUN + network namespaces)
      run: sudo bash tests/e2e_vpn.sh src/clawsec
    
    - name: Upload artifact
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: clawsec-linux
        path: src/clawsec

    - name: Opt-in -e build compiles and offers -e
      run: |
        cd src
        make clean
        make linux DFLAGS=-DGAPING_SECURITY_HOLE
        ./clawsec -h 2>&1 | grep -- '-e <program>'

  sanitizers:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libssl-dev libargon2-dev zlib1g-dev build-essential

    - name: Unit tests under AddressSanitizer + UndefinedBehaviorSanitizer
      run: |
        cd src
        make test-asan

  build-macos:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    
    - name: Install dependencies
      run: |
        brew install openssl@3 argon2
    
    - name: Build
      run: |
        cd src
        make clean
        make macos
    
    - name: Run tests
      run: |
        cd src
        make test-macos
    
    - name: Test binary
      run: |
        cd src
        ./clawsec -h || true
        test -f clawsec
    
    - name: Upload artifact
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: clawsec-macos
        path: src/clawsec

  docker-build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
    
    - name: Build Docker image
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        push: false
        tags: clawsec:test
    
    - name: Test Docker image
      run: |
        docker run --rm clawsec:test -h || true
